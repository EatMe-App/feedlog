services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: feedlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - feedlog-net

  app:
    build: .
    image: feedlog-eatme:latest
    container_name: feedlog-eatme
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/.data
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/feedlog
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SYSTEM_ADMIN_EMAILS=${SYSTEM_ADMIN_EMAILS}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://feedback.eatme-app.com}
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - SUPABASE_OAUTH_CLIENT_ID
      - SUPABASE_OAUTH_CLIENT_SECRET
      - SUPABASE_PROJECT_REF
      - SUPABASE_OAUTH_DISCOVERY_URL
      - AUTH_EMAIL_ENABLED
      - AUTH_EMAIL_VERIFY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_TEXT_MODEL
      - EMAIL_PROVIDER
      - RESEND_API_KEY
      - EMAIL_FROM
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_BUCKET
      - S3_ENDPOINT
      - S3_REGION
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.feedlog.rule=Host(`feedback.eatme-app.com`)
      - traefik.http.routers.feedlog.entrypoints=websecure
      - traefik.http.routers.feedlog.tls=true
      - traefik.http.routers.feedlog.tls.certresolver=clacme
      - traefik.http.services.feedlog.loadbalancer.server.port=3000
      - traefik.http.services.feedlog.loadbalancer.server.scheme=http
      - traefik.http.routers.feedlog.middlewares=cors@docker,traefik-ratelimit@docker
      - traefik.constraint=proxy-public
    networks:
      - feedlog-net
      - traefik-proxy

volumes:
  db-data:
  app-data:

networks:
  feedlog-net:
    driver: bridge
  traefik-proxy:
    external: true

