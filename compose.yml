services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: feedlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - feedlog-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: feedlog-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID:-feedlogaccesskey}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-feedlogsecretkey}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
    volumes:
      - rustfs-data:/data
    networks:
      - feedlog-net

  app:
    build: .
    image: feedlog-eatme:latest
    container_name: feedlog-eatme
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - app-data:/app/.data
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/feedlog
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SYSTEM_ADMIN_EMAILS=${SYSTEM_ADMIN_EMAILS}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://feedback.eatme-app.com}
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - GITHUB_CLIENT_ID
      # - GITHUB_CLIENT_SECRET
      - SUPABASE_OAUTH_CLIENT_ID=${SUPABASE_OAUTH_CLIENT_ID}
      - SUPABASE_OAUTH_CLIENT_SECRET=${SUPABASE_OAUTH_CLIENT_SECRET}
      - SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_ID}
      - SUPABASE_OAUTH_DISCOVERY_URL=https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1/.well-known/openid-configuration
      - AUTH_EMAIL_ENABLED
      - AUTH_EMAIL_VERIFY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_TEXT_MODEL
      - EMAIL_PROVIDER
      - RESEND_API_KEY
      - BREVO_API_KEY
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - SMTP_SECURE
      - EMAIL_FROM
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-feedlogaccesskey}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-feedlogsecretkey}
      - S3_BUCKET=${S3_BUCKET:-feedlog}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.feedlog.rule=Host(`feedback.eatme-app.com`)
      - traefik.http.routers.feedlog.entrypoints=websecure
      - traefik.http.routers.feedlog.tls=true
      - traefik.http.routers.feedlog.tls.certresolver=clacme
      - traefik.http.services.feedlog.loadbalancer.server.port=3000
      - traefik.http.services.feedlog.loadbalancer.server.scheme=http
      - traefik.http.routers.feedlog.middlewares=cors@docker,traefik-ratelimit@docker
      - traefik.constraint=proxy-public
    networks:
      - feedlog-net
      - traefik-proxy

volumes:
  db-data:
  app-data:
  rustfs-data:

networks:
  feedlog-net:
    driver: bridge
  traefik-proxy:
    external: true

